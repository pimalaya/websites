<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#bf1e83" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Pimalaya blog | The project journal</title>
    <meta
      name="description"
      content="News from Pimalaya, an ambitious project that aims to improve open-source tools related to personal information management."
    />
    <link rel="canonical" href="https://blog.pimalaya.org/" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Pimalaya blog"
      href="https://blog.pimalaya.org/feed.xml"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pimalaya blog" />
    <meta property="og:title" content="Pimalaya blog | The project journal" />
    <meta
      property="og:description"
      content="News from Pimalaya, an ambitious project that aims to improve open-source tools related to personal information management."
    />
    <meta property="og:url" content="https://blog.pimalaya.org/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://blog.pimalaya.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Pimalaya blog, the project journal"
    />

    <!-- Twitter card (falls back to the Open Graph tags for the rest) -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Per-page head bits, injected by prerender.js. -->
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
